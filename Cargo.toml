[package]
name = "rustproxy"
version = "0.2.1"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "server"
path = "src/server_main.rs"

[[bin]]
name = "client"
path = "src/client_main.rs"
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
[profile.release]
strip = true
lto = "thin"

[[bin]]
name = "server-gui"
path = "src/server_gui.rs"

[[bin]]
name = "client-gui"
path = "src/client_gui.rs"
